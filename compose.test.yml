services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: coffee-local-test-only
      MYSQL_DATABASE: coffee_test
    ports: ['127.0.0.1:13308:3306']
    tmpfs: ['/var/lib/mysql']
    healthcheck:
      test: ['CMD','mysqladmin','ping','-h','localhost','-pcoffee-local-test-only']
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:16379:6379']
